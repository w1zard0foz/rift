<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ceiling Rift</title>
<style>
:root{color-scheme:dark;--x:0vw;--y:0vh;--scale:1;--brightness:1.12;--speed:18s}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{font-family:system-ui,sans-serif;cursor:none}
body.ui-active{cursor:default}
.stage{position:fixed;top:0;right:0;bottom:0;left:0;width:100vw;height:100vh;overflow:hidden;background:#000}
.scene{position:absolute;top:0;left:0;width:100vw;height:100vh;transform:translate(var(--x),var(--y)) scale(var(--scale));transform-origin:38.5% 50%;filter:brightness(var(--brightness));will-change:transform}
.base,.moving-cosmos{position:absolute;top:0;left:0;width:100vw;height:100vh;object-fit:cover;user-select:none;pointer-events:none}
.base{z-index:1}
.window{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:2;clip-path:polygon(36.6% 13%,42.8% 16%,46.7% 27%,48.5% 43%,47.6% 61%,44.3% 76%,39% 86%,34.3% 80%,30.6% 68%,28.7% 52%,29.7% 36%,32.1% 22%);overflow:hidden;opacity:.68;mix-blend-mode:screen}
.moving-cosmos{transform-origin:38.5% 50%;animation:drift var(--speed) ease-in-out infinite alternate;filter:saturate(1.3) contrast(1.08)}
.energy{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:3;clip-path:polygon(36.6% 13%,42.8% 16%,46.7% 27%,48.5% 43%,47.6% 61%,44.3% 76%,39% 86%,34.3% 80%,30.6% 68%,28.7% 52%,29.7% 36%,32.1% 22%);background:radial-gradient(ellipse at 39% 49%,transparent 0 23%,rgba(58,34,255,.08) 42%,rgba(117,70,255,.17) 58%,transparent 73%);mix-blend-mode:screen;animation:pulse calc(var(--speed)*.62) ease-in-out infinite alternate;pointer-events:none}
.controls{position:fixed;right:16px;bottom:16px;z-index:10;width:min(340px,calc(100vw - 32px));padding:14px 16px;border:1px solid rgba(255,255,255,.16);border-radius:11px;background:rgba(2,3,8,.88);color:#d9e1ff;box-shadow:0 12px 44px rgba(0,0,0,.7);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s}
.ui-active .controls{opacity:1;transform:none;pointer-events:auto}
.controls strong{display:block;margin-bottom:3px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.controls small{display:block;margin-bottom:10px;color:#8790aa}
.row{display:grid;grid-template-columns:78px 1fr 38px;gap:8px;align-items:center;margin:8px 0;font-size:11px}
input{width:100%;accent-color:#745dff}
.buttons{display:flex;gap:7px;margin-top:11px}
button{flex:1;padding:7px;border:1px solid rgba(255,255,255,.17);border-radius:7px;background:#101426;color:#d9e1ff}
@keyframes drift{from{transform:rotate(-3.2deg) scale(1.01)}to{transform:rotate(3.2deg) scale(1.09)}}
@keyframes pulse{from{opacity:.28}to{opacity:1}}
</style>
</head>
<body>
<main class="stage">
  <div class="scene" id="scene">
    <img class="base" src="assets/rift-projector.png" alt="">
    <div class="window"><img class="moving-cosmos" src="assets/rift-projector.png" alt=""></div>
    <div class="energy"></div>
  </div>
</main>
<aside class="controls" id="controls">
  <strong>Rift calibration</strong>
  <small>Panel hides after 30 seconds. Move pointer to restore.</small>
  <label class="row">Horizontal<input id="x" type="range" min="-40" max="40" value="0"><output>0</output></label>
  <label class="row">Vertical<input id="y" type="range" min="-40" max="40" value="0"><output>0</output></label>
  <label class="row">Size<input id="scale" type="range" min="60" max="180" value="100"><output>100</output></label>
  <label class="row">Brightness<input id="brightness" type="range" min="60" max="180" value="112"><output>112</output></label>
  <label class="row">Motion<input id="motion" type="range" min="8" max="45" value="18"><output>18</output></label>
  <div class="buttons"><button id="full">Fullscreen</button><button id="reset">Reset</button></div>
</aside>
<script>
(()=>{
const root=document.documentElement;
const defaults={x:0,y:0,scale:100,brightness:112,motion:18};
let state={...defaults,...JSON.parse(localStorage.getItem('riftSettings')||'{}')};
const ids=Object.keys(defaults);
function apply(){
 root.style.setProperty('--x',state.x+'vw');
 root.style.setProperty('--y',state.y+'vh');
 root.style.setProperty('--scale',state.scale/100);
 root.style.setProperty('--brightness',state.brightness/100);
 root.style.setProperty('--speed',state.motion+'s');
 ids.forEach(id=>{const el=document.getElementById(id);el.value=state[id];el.nextElementSibling.value=state[id]});
 localStorage.setItem('riftSettings',JSON.stringify(state));
}
ids.forEach(id=>document.getElementById(id).addEventListener('input',e=>{state[id]=+e.target.value;apply()}));
let hideTimer;
function wake(){
 document.body.classList.add('ui-active');
 clearTimeout(hideTimer);
 hideTimer=setTimeout(()=>document.body.classList.remove('ui-active'),30000);
}
['mousemove','pointermove','touchstart'].forEach(event=>document.addEventListener(event,wake,{passive:true}));
document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.getElementById('reset').onclick=()=>{state={...defaults};apply()};
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.getElementById('full').click()});
apply();wake();
})();
</script>
</body>
</html>
