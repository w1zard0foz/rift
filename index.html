<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmos Rift</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.7);
    padding: 16px 20px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    cursor: default;
    opacity: 0;
    transition: opacity 0.4s;
    max-width: 280px;
  }
  body:hover #controls { opacity: 1; }
  #controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 12px;
  }
  #controls label span { white-space: nowrap; }
  #controls label:last-of-type { margin-bottom: 0; }
  #controls input[type="range"] {
    width: 130px;
    accent-color: #667;
  }
  #controls button {
    margin-top: 10px;
    width: 100%;
    padding: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #controls button:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="controls">
  <label><span>Speed</span> <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1"></label>
  <label><span>Crack width</span> <input type="range" id="crackWidth" min="0.01" max="0.12" step="0.005" value="0.045"></label>
  <label><span>Glow intensity</span> <input type="range" id="glow" min="0.5" max="4" step="0.1" value="2"></label>
  <label><span>Glow reach</span> <input type="range" id="glowReach" min="0.02" max="0.2" step="0.005" value="0.08"></label>
  <label><span>Jaggedness</span> <input type="range" id="jagged" min="0.5" max="4" step="0.1" value="2"></label>
  <label><span>Nebula depth</span> <input type="range" id="nebula" min="0.3" max="2" step="0.1" value="1"></label>
  <label><span>Cosmos swirl</span> <input type="range" id="swirl" min="0" max="2" step="0.1" value="0.8"></label>
  <label><span>Light bleed</span> <input type="range" id="bleed" min="0" max="1" step="0.05" value="0.3"></label>
  <button onclick="toggleFullscreen()">Fullscreen</button>
</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

const vertSrc = `
  attribute vec2 pos;
  void main() { gl_Position = vec4(pos, 0.0, 1.0); }
`;

const fragSrc = `
#ifdef GL_ES
precision highp float;
#endif

uniform vec2 uRes;
uniform float uTime;
uniform float uSpeed;
uniform float uCrackWidth;
uniform float uGlow;
uniform float uGlowReach;
uniform float uJagged;
uniform float uNebula;
uniform float uSwirl;
uniform float uBleed;

// ---- Noise ----
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

float fbm(vec3 p) {
  float v = 0.0, a = 0.5, f = 1.0;
  for(int i = 0; i < 6; i++) {
    v += a * snoise(p * f);
    f *= 2.1; a *= 0.48;
  }
  return v;
}

float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// ---- Crack shape ----
// The crack is a jagged line running diagonally, like the Doctor Who crack.
// We define it as a curve and measure distance to it.

float crackCurve(float x, float t) {
  // Base curve - a slight arc
  float base = (x - 0.5) * 0.15;
  // Jagged distortion at multiple frequencies
  float jag = 0.0;
  jag += snoise(vec3(x * 3.0, t * 0.15, 0.0)) * 0.06 * uJagged;
  jag += snoise(vec3(x * 7.0, t * 0.12, 5.0)) * 0.03 * uJagged;
  jag += snoise(vec3(x * 15.0, t * 0.08, 10.0)) * 0.012 * uJagged;
  jag += snoise(vec3(x * 30.0, t * 0.05, 15.0)) * 0.005 * uJagged;
  return base + jag;
}

// Variable width along the crack - wide in middle, tapering to sharp points
float crackHalfWidth(float x) {
  // x is parametric position along crack, 0-1
  // Taper at both ends, widest around 0.4-0.6
  float taper = smoothstep(0.0, 0.15, x) * smoothstep(1.0, 0.8, x);
  // Add some irregularity to width
  float widthVar = 0.7 + 0.3 * snoise(vec3(x * 8.0, 3.0, 0.0));
  return uCrackWidth * taper * widthVar;
}

// ---- Stars for the cosmos inside ----
float starField(vec2 uv, float scale, float t) {
  vec2 gv = fract(uv * scale) - 0.5;
  vec2 id = floor(uv * scale);
  float rnd = hash(id);
  float size = smoothstep(0.95, 1.0, rnd) * 0.015;
  size += smoothstep(0.85, 0.95, rnd) * 0.006;
  float d = length(gv);
  float twinkle = sin(t * (2.0 + rnd * 4.0) + rnd * 6.28) * 0.4 + 0.6;
  return smoothstep(size, size * 0.05, d) * twinkle * step(0.78, rnd);
}

vec3 starColor(vec2 uv, float scale) {
  vec2 id = floor(uv * scale);
  float r = hash(id + 99.0);
  vec3 cool = vec3(0.7, 0.8, 1.0);
  vec3 warm = vec3(1.0, 0.9, 0.7);
  return mix(cool, warm, r);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  float t = uTime * uSpeed;

  // ---- Define the crack in screen space ----
  // Crack runs roughly from lower-left to upper-right area,
  // positioned in the upper portion for ceiling projection.
  // We rotate and position the crack.

  // Transform UV to crack space
  // Crack center at (0.35, 0.6), angled ~30 degrees
  float angle = 0.45;
  float cosA = cos(angle), sinA = sin(angle);
  vec2 center = vec2(0.35, 0.6);
  vec2 p = uv - center;
  p.x *= aspect;
  // Rotate
  vec2 rp = vec2(p.x * cosA + p.y * sinA, -p.x * sinA + p.y * cosA);

  // Parametric position along crack (0-1 maps to crack length)
  float crackLen = 0.7;
  float along = (rp.x / crackLen) + 0.5; // 0 to 1 along the crack

  // Get the crack's y-offset at this x position
  float crackY = crackCurve(along, t);

  // Distance from this pixel to the crack centerline
  float distToCrack = abs(rp.y - crackY);

  // Half-width at this position
  float hw = crackHalfWidth(along);

  // Are we inside the crack?
  float inCrack = 1.0 - smoothstep(hw * 0.6, hw, distToCrack);

  // Only where the crack exists (along 0-1 range)
  float alongMask = smoothstep(-0.02, 0.05, along) * smoothstep(1.02, 0.95, along);
  inCrack *= alongMask;

  // ---- Cosmos visible through the crack ----
  // Swirling deep space
  vec2 cosmosUV = uv;
  // Add swirl distortion
  float swirlAngle = fbm(vec3(uv * 2.0, t * 0.03)) * uSwirl * 1.5;
  float sc = cos(swirlAngle), ss = sin(swirlAngle);
  cosmosUV = vec2(cosmosUV.x * sc - cosmosUV.y * ss,
                  cosmosUV.x * ss + cosmosUV.y * sc);

  vec2 cuvA = vec2(cosmosUV.x * aspect, cosmosUV.y);

  // Deep nebula layers
  vec3 n1p = vec3(cuvA * 3.0 + vec2(t * 0.012, t * 0.008), t * 0.006);
  float neb1 = fbm(n1p) * uNebula;
  vec3 n2p = vec3(cuvA * 2.0 + vec2(-t * 0.01, t * 0.007), t * 0.005 + 5.0);
  float neb2 = fbm(n2p) * uNebula;
  vec3 n3p = vec3(cuvA * 4.5 + vec2(t * 0.005, -t * 0.009), t * 0.004 + 10.0);
  float neb3 = fbm(n3p) * uNebula * 0.7;

  // Cosmos colors - rich purples, deep blues, hints of magenta
  vec3 voidBlack  = vec3(0.005, 0.002, 0.01);
  vec3 deepPurple = vec3(0.15, 0.02, 0.2);
  vec3 cosmicBlue = vec3(0.02, 0.04, 0.18);
  vec3 magenta    = vec3(0.2, 0.01, 0.15);
  vec3 hotPurple  = vec3(0.3, 0.05, 0.35);
  vec3 darkTeal   = vec3(0.01, 0.08, 0.12);

  vec3 cosmos = voidBlack;
  cosmos += deepPurple * smoothstep(-0.2, 0.5, neb1) * 1.3;
  cosmos += cosmicBlue * smoothstep(-0.1, 0.6, neb2) * 0.8;
  cosmos += magenta * smoothstep(0.1, 0.7, neb1 * neb2 * 4.0) * 1.0;
  cosmos += hotPurple * smoothstep(0.3, 0.8, neb3) * 0.6;
  cosmos += darkTeal * smoothstep(-0.2, 0.4, neb2 - neb1) * 0.5;

  // Bright nebula wisps deep inside
  float wisp = smoothstep(0.5, 0.7, neb1) * smoothstep(0.4, 0.6, neb2);
  cosmos += vec3(0.25, 0.1, 0.35) * wisp * uNebula;

  // Galaxy swirl hint
  float galaxy = smoothstep(0.55, 0.65, neb3) * smoothstep(0.45, 0.6, neb1);
  cosmos += vec3(0.4, 0.2, 0.5) * galaxy * 0.4;

  // Stars inside the rift
  float starsTotal = 0.0;
  vec3 starsCol = vec3(0.0);
  for(int i = 0; i < 3; i++) {
    float fi = float(i);
    float scale = 50.0 + fi * 40.0;
    vec2 drift = vec2(t * 0.01 * (1.0 + fi * 0.5), t * 0.005 * (1.0 + fi * 0.3));
    float sf = starField(cuvA + drift, scale, t);
    starsCol += starColor(cuvA + drift, scale) * sf;
    starsTotal += sf;
  }
  cosmos += starsCol * 1.8;

  // ---- Crack edge glow ----
  // Hot white-blue core glow right at the edge
  float edgeDist = distToCrack - hw * 0.5;
  float coreGlow = exp(-max(edgeDist, 0.0) * (40.0 / max(uGlowReach, 0.01))) * alongMask;

  // Wider atmospheric glow
  float atmoGlow = exp(-max(distToCrack - hw * 0.3, 0.0) * (8.0 / max(uGlowReach, 0.01))) * alongMask;

  // Pulsing energy along the crack
  float pulse = sin(along * 20.0 - t * 0.8) * 0.3 + 0.7;
  float pulse2 = sin(along * 35.0 + t * 0.5) * 0.2 + 0.8;

  // Glow colors
  vec3 coreColor = vec3(0.9, 0.85, 1.0); // near-white with slight purple
  vec3 midColor = vec3(0.5, 0.3, 0.9);    // purple
  vec3 outerColor = vec3(0.2, 0.1, 0.5);  // deep purple

  vec3 glowCol = vec3(0.0);
  glowCol += coreColor * coreGlow * 1.5 * pulse * uGlow;
  glowCol += midColor * atmoGlow * 0.6 * pulse2 * uGlow;
  glowCol += outerColor * atmoGlow * 0.3 * uGlow;

  // ---- Light bleed tendrils ----
  // Faint wisps of light that leak out from the crack
  float tendril1 = snoise(vec3(rp * 8.0, t * 0.1));
  float tendril2 = snoise(vec3(rp * 15.0, t * 0.07 + 5.0));
  float tendrilMask = exp(-max(distToCrack - hw, 0.0) * 4.0) * alongMask;
  float tendrils = max(tendril1 * 0.5 + tendril2 * 0.3, 0.0) * tendrilMask;
  vec3 tendrilCol = vec3(0.15, 0.05, 0.3) * tendrils * uBleed;

  // ---- Compose ----
  vec3 col = vec3(0.0);

  // Cosmos visible through the crack
  col += cosmos * inCrack;

  // Edge glow on top
  col += glowCol;

  // Light bleed
  col += tendrilCol;

  // Very faint ambient spill near the crack
  float ambientSpill = exp(-distToCrack * 3.0) * alongMask * 0.02 * uBleed;
  col += vec3(0.1, 0.03, 0.15) * ambientSpill;

  // Tone mapping - keep it filmic
  col = col / (col + 0.8);
  col = pow(col, vec3(0.92));

  gl_FragColor = vec4(col, 1.0);
}
`;

// ---- WebGL setup ----
function createShader(type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

const vs = createShader(gl.VERTEX_SHADER, vertSrc);
const fs = createShader(gl.FRAGMENT_SHADER, fragSrc);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error('Link error:', gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uSpeed = gl.getUniformLocation(prog, 'uSpeed');
const uCrackWidth = gl.getUniformLocation(prog, 'uCrackWidth');
const uGlow = gl.getUniformLocation(prog, 'uGlow');
const uGlowReach = gl.getUniformLocation(prog, 'uGlowReach');
const uJagged = gl.getUniformLocation(prog, 'uJagged');
const uNebula = gl.getUniformLocation(prog, 'uNebula');
const uSwirl = gl.getUniformLocation(prog, 'uSwirl');
const uBleed = gl.getUniformLocation(prog, 'uBleed');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const els = {
  speed: document.getElementById('speed'),
  crackWidth: document.getElementById('crackWidth'),
  glow: document.getElementById('glow'),
  glowReach: document.getElementById('glowReach'),
  jagged: document.getElementById('jagged'),
  nebula: document.getElementById('nebula'),
  swirl: document.getElementById('swirl'),
  bleed: document.getElementById('bleed'),
};

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

const startTime = performance.now();
function frame() {
  const t = (performance.now() - startTime) / 1000.0;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform1f(uSpeed, parseFloat(els.speed.value));
  gl.uniform1f(uCrackWidth, parseFloat(els.crackWidth.value));
  gl.uniform1f(uGlow, parseFloat(els.glow.value));
  gl.uniform1f(uGlowReach, parseFloat(els.glowReach.value));
  gl.uniform1f(uJagged, parseFloat(els.jagged.value));
  gl.uniform1f(uNebula, parseFloat(els.nebula.value));
  gl.uniform1f(uSwirl, parseFloat(els.swirl.value));
  gl.uniform1f(uBleed, parseFloat(els.bleed.value));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
frame();

let cursorTimeout;
document.addEventListener('mousemove', () => {
  document.body.style.cursor = 'default';
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.style.cursor = 'none';
  }, 3000);
});
</script>
</body>
</html>
